<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>FishVN</title>
    <script>
      // 首帧钩子：读 localStorage 打 data-theme / data-accent，赶在 CSS 与 JS 包之前，
      // 避免包加载后深浅或色系闪变。浅色与绯红是默认值，不打属性。
      // --splash-accent 供启动页使用：tokens.css 随 JS 包才到，这里先按同一张表兜底。
      (() => {
        const root = document.documentElement;
        if (localStorage.getItem('fishvn.theme') === 'dark') {
          root.dataset.theme = 'dark';
        }
        const accent = localStorage.getItem('fishvn.accent');
        if (accent && accent !== 'default') {
          root.dataset.accent = accent;
        }
        const fontScale = localStorage.getItem('fishvn.fontScale');
        if (fontScale) {
          root.style.setProperty('--app-font-scale', fontScale);
        }
        // 与 tokens.css 的强调色表一致；改色值要同步
        const palette = {
          default: ['#c92a4a', '#e13a5a'],
          amber: ['#967a0e', '#d4a017'],
          ocean: ['#0369a1', '#0ea5e9'],
          sakura: ['#d9468a', '#ec4899'],
          emerald: ['#058050', '#059669'],
          violet: ['#6d28d9', '#7c3aed'],
        };
        const pair = palette[accent] || palette.default;
        root.style.setProperty('--splash-accent', root.dataset.theme === 'dark' ? pair[1] : pair[0]);
      })();
    </script>
    <style>
      /* 启动页：窗口 show 时已在 DOM 中，内容就绪后淡出移除。 */
      /* tokens.css 随 JS 包才到，首帧靠 var 的字面量兜底，取值与 tokens 的 --bg-page / --accent 严格一致。 */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: var(--bg-page, #f1f0ec);
        transition: opacity 160ms ease;
      }
      [data-theme='dark'] #splash {
        background: var(--bg-page, #121212);
      }
      #splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-mark {
        width: 112px;
        height: 112px;
      }
      #splash .splash-spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid color-mix(in srgb, var(--splash-accent, #c92a4a) 18%, transparent);
        border-top-color: var(--splash-accent, #c92a4a);
        animation: splash-spin 0.9s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="splash-mark" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="16" height="16" rx="3" fill="var(--splash-accent, #c92a4a)" />
        <g transform="translate(8 8) scale(1.22 1.08) translate(-7.52 -7.95)">
          <path d="M2.0 8.0 C2.0 6.8 2.9 6.1 4.2 6.1 C5.6 6.1 6.8 6.6 7.5 7.4 L7.5 8.6 C6.8 9.4 5.6 9.9 4.2 9.9 C2.9 9.9 2.0 9.2 2.0 8.0 Z" fill="#f5f4f1" />
          <path d="M4.25 5.05 C5.05 3.45 6.25 2.35 7.45 1.95 C8.15 2.45 8.15 3.55 7.45 4.55 C6.45 4.95 5.35 5.05 4.25 5.05 Z" fill="#f5f4f1" />
          <path d="M4.3 10.85 C5.1 12.45 6.3 13.55 7.5 13.95 C8.2 13.45 8.2 12.35 7.5 11.35 C6.5 10.95 5.4 10.85 4.3 10.85 Z" fill="#f5f4f1" />
          <g transform="translate(8 8) scale(0.84) translate(-8 -8)">
            <path d="M6.4 6.4 C7.4 4.7 8.8 3.3 10.3 2.7 C11.3 2.4 12.2 2.8 12.5 3.7 C12.7 4.3 12.9 4.7 13.3 5.2 C13.8 6.0 14.0 7.0 14.0 8.0 C14.0 9.0 13.8 10.0 13.3 10.8 C12.9 11.3 12.7 11.7 12.5 12.3 C12.2 13.2 11.3 13.6 10.3 13.3 C8.8 12.7 7.4 11.3 6.4 9.6 Z" fill="#f5f4f1" />
            <path d="M12.4 4.0 L8.9 6.2 L9.3 6.5 L12.7 4.3 Z" fill="var(--splash-accent, #c92a4a)" />
            <path d="M12.4 12.0 L8.9 9.8 L9.3 9.5 L12.7 11.7 Z" fill="var(--splash-accent, #c92a4a)" />
            <path d="M8.3 7.5 L13.1 5.5" stroke="var(--splash-accent, #c92a4a)" stroke-width="0.26" stroke-linecap="round" fill="none" />
            <path d="M8.3 8.0 L14.0 8.0" stroke="var(--splash-accent, #c92a4a)" stroke-width="0.26" stroke-linecap="round" fill="none" />
            <path d="M8.3 8.5 L13.1 10.5" stroke="var(--splash-accent, #c92a4a)" stroke-width="0.26" stroke-linecap="round" fill="none" />
          </g>
          <circle cx="3.5" cy="7.2" r="0.62" fill="var(--splash-accent, #c92a4a)" />
        </g>
      </svg>
      <div class="splash-spinner"></div>
    </div>
    <script>
      (() => {
        const internals = window.__TAURI_INTERNALS__;
        const splash = document.getElementById('splash');
        if (!internals || !splash) return;

        // 窗口在「内容就绪」与「加载页该出现」两者先到者处显示，出现时必定已有内容。
        // SPLASH_AFTER 高于打包版列表就绪时间（本机 160ms 内），就绪更快时窗口直接带内容。
        const SPLASH_AFTER = 250;
        const MIN_VISIBLE = 300;
        const now = () => Math.round(performance.now());
        const parsedAt = now();
        const report = (level, message) =>
          internals.invoke('log_frontend', { level, message }).catch(() => {});

        let shown = false;
        let revealedAt = 0;
        let done = false;
        let showTimer = 0;

        function showWindow(withSplash) {
          if (shown) return;
          shown = true;
          if (withSplash) {
            revealedAt = performance.now();
          }
          internals
            .invoke('plugin:window|show', { label: internals.metadata.currentWindow.label })
            .then(() =>
              report(
                'info',
                `启动：窗口 show 返回 ${now()}ms（解析 ${parsedAt}ms，${withSplash ? '带加载页' : '直接进内容'}）`
              )
            )
            .catch((e) => report('warn', `启动：窗口 show 失败 ${e}`));
        }

        window.__splash = {
          ready() {
            if (done) return;
            done = true;
            clearTimeout(showTimer);
            if (!shown) {
              showWindow(false);
              splash.remove();
              return;
            }
            const wait = Math.max(0, revealedAt + MIN_VISIBLE - performance.now());
            setTimeout(() => {
              splash.classList.add('is-hidden');
              splash.addEventListener('transitionend', () => splash.remove(), { once: true });
            }, wait);
          },
        };

        showTimer = setTimeout(() => showWindow(true), SPLASH_AFTER);
      })();
    </script>
    <div id="app"></div>
    <div id="modal-root"></div>
    <script src="/vendor/gsap/gsap.min.js"></script>
    <script src="/vendor/gsap/ScrollTrigger.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
