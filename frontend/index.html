<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>FishVN</title>
    <script>
      // 首帧钩子：读 localStorage 打 data-theme / data-accent，赶在 CSS 与 JS 包之前，
      // 避免包加载后深浅或色系闪变。浅色与绯红是默认值，不打属性。
      // --splash-accent 供启动页使用：tokens.css 随 JS 包才到，这里先按同一张表兜底。
      (() => {
        const root = document.documentElement;
        const theme = localStorage.getItem('fishvn.theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (theme === 'system' && systemDark)) {
          root.dataset.theme = 'dark';
        }
        const accent = localStorage.getItem('fishvn.accent');
        if (accent && accent !== 'default') {
          root.dataset.accent = accent;
        }
        const fontScale = localStorage.getItem('fishvn.fontScale');
        if (fontScale) {
          root.style.setProperty('--app-font-scale', fontScale);
        }
        // 与 tokens.css 的强调色表一致；改色值要同步
        const palette = {
          default: ['#c92a4a', '#e13a5a'],
          amber: ['#967a0e', '#d4a017'],
          ocean: ['#0369a1', '#0ea5e9'],
          sakura: ['#d9468a', '#ec4899'],
          emerald: ['#058050', '#059669'],
          violet: ['#6d28d9', '#7c3aed'],
        };
        const pair = palette[accent] || palette.default;
        root.style.setProperty('--splash-accent', root.dataset.theme === 'dark' ? pair[1] : pair[0]);
      })();
    </script>
    <style>
      /* 启动页：窗口 show 时已在 DOM 中，内容就绪后淡出移除。 */
      /* tokens.css 随 JS 包才到，首帧靠 var 的字面量兜底，取值与 tokens 的 --bg-page / --accent 严格一致。 */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: var(--bg-page, #f1f0ec);
        transition: opacity 160ms ease;
      }
      [data-theme='dark'] #splash {
        background: var(--bg-page, #121212);
      }
      #splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-mark {
        width: 112px;
        height: 112px;
      }
      #splash .splash-spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid color-mix(in srgb, var(--splash-accent, #c92a4a) 18%, transparent);
        border-top-color: var(--splash-accent, #c92a4a);
        animation: splash-spin 0.9s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .brand-sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      #splash .brand-mark {
        display: inline-grid;
        place-items: center;
        border-radius: 22.37%;
        overflow: hidden;
        background: var(--splash-accent, #c92a4a);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
      }
      #splash .brand-mark svg {
        display: block;
        width: 94%;
        height: auto;
        aspect-ratio: 547 / 307;
        color: var(--fg-on-accent, #ffffff);
      }
      [data-theme='dark'] #splash .brand-mark {
        background: var(--bg-surface, #1f1f1f);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }
      [data-theme='dark'] #splash .brand-mark svg {
        color: var(--splash-accent, #e13a5a);
      }
    </style>
  </head>

    <script>
      (() => {
        // sessionStorage 跨 F5 存活、冷启动为空：先读后写，刷新时不再调 show、不记启动计时。
        const BOOT_KEY = 'fishvn:booted';
        const reloaded = sessionStorage.getItem(BOOT_KEY) !== null;
        sessionStorage.setItem(BOOT_KEY, '1');
        window.__reloaded = reloaded;
        const internals = window.__TAURI_INTERNALS__;
        const splash = document.getElementById('splash');
        if (!internals || !splash) return;

        // 窗口在「内容就绪」与「加载页该出现」两者先到者处显示，出现时必定已有内容。
        // SPLASH_AFTER 高于打包版列表就绪时间（本机 160ms 内），就绪更快时窗口直接带内容。
        const SPLASH_AFTER = 250;
        const MIN_VISIBLE = 300;
        const now = () => Math.round(performance.now());
        const parsedAt = now();
        const report = (level, message) =>
          internals.invoke('log_frontend', { level, message }).catch(() => {});

        let shown = false;
        let revealedAt = 0;
        let done = false;
        let showTimer = 0;

        function showWindow(withSplash) {
          if (shown) return;
          shown = true;
          if (withSplash) {
            revealedAt = performance.now();
          }
          if (reloaded) return;
          internals
            .invoke('plugin:window|show', { label: internals.metadata.currentWindow.label })
            .then(() =>
              report(
                'info',
                `启动：窗口 show 返回 ${now()}ms（解析 ${parsedAt}ms，${withSplash ? '带加载页' : '直接进内容'}）`
              )
            )
            .catch((e) => report('warn', `启动：窗口 show 失败 ${e}`));
        }

        window.__splash = {
          ready() {
            if (done) return;
            done = true;
            clearTimeout(showTimer);
            if (!shown) {
              showWindow(false);
              splash.remove();
              return;
            }
            const wait = Math.max(0, revealedAt + MIN_VISIBLE - performance.now());
            setTimeout(() => {
              splash.classList.add('is-hidden');
              splash.addEventListener('transitionend', () => splash.remove(), { once: true });
            }, wait);
          },
        };

        showTimer = setTimeout(() => showWindow(true), SPLASH_AFTER);
      })();
    </script>
